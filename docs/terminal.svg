    <linearGradient id="edge"><stop stop-color="#22d3ee"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
  </defs>
  <rect width="960" height="500" rx="24" fill="url(#bg)"/>
  <rect x="28" y="28" width="904" height="444" rx="16" fill="#0c1220" stroke="#29344a"/>
  <path d="M44 28H916Q932 28 932 44V75H28V44Q28 28 44 28" fill="#151e30"/>
  <circle cx="51" cy="52" r="6" fill="#fb7185"/><circle cx="72" cy="52" r="6" fill="#fbbf24"/><circle cx="93" cy="52" r="6" fill="#34d399"/>
  <text x="480" y="57" text-anchor="middle" fill="#8090aa" font-family="Segoe UI, sans-serif" font-size="13">PowerShell · Bravel</text>
  <g font-family="Cascadia Code, Consolas, monospace" font-size="17">
    <text x="55" y="118" fill="#94a3b8">PS C:\Users\you&gt; <tspan fill="#f1f5f9"># команда для вывода сетей</tspan></text>
    <text x="55" y="167" fill="#22d3ee" font-size="22" font-weight="bold">◆ BRAVEL <tspan font-size="14" font-weight="normal" fill="#94a3b8">/ твоя консоль, с помощником</tspan></text>
    <rect x="55" y="197" width="850" height="163" rx="9" fill="#101b2b" stroke="url(#edge)"/>
    <text x="77" y="227" fill="#22d3ee" font-size="13">01 / 01 · LOW</text>
    <text x="77" y="272" fill="#f8fafc" font-size="22">netsh wlan show networks</text>
    <text x="77" y="316" fill="#a8b6ca" font-size="15">Показать доступные Wi-Fi сети в Windows.</text>
    <text x="55" y="409" fill="#22d3ee">Выполнить? [Y/n] <tspan fill="#64748b">(Enter = n): </tspan><tspan fill="#f1f5f9">█</tspan></text>
    <text x="55" y="449" fill="#64748b" font-size="12">Сначала точная команда. Затем твое подтверждение.</text>
  </g>
