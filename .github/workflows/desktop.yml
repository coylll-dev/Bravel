name: Desktop
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions:
  contents: read
jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-latest
            rid: linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install .
      - run: dotnet build desktop/Bravel.Desktop -c Release
      - run: python tests/desktop_smoke.py
      - name: Render real application without display
        run: dotnet desktop/Bravel.Desktop/bin/Release/net10.0/Bravel.Desktop.dll --render-preview desktop-preview.png
      - name: Publish portable app
        run: dotnet publish desktop/Bravel.Desktop -c Release -r ${{ matrix.rid }} --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o dist/desktop
      - name: Package
        shell: python
        run: |
          import shutil
          shutil.make_archive('bravel-desktop-${{ matrix.rid }}', 'zip', 'dist/desktop')
      - uses: actions/upload-artifact@v4
        with:
          name: bravel-desktop-${{ matrix.rid }}
          path: bravel-desktop-${{ matrix.rid }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: preview-${{ matrix.rid }}
          path: desktop-preview.png
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: bravel-desktop-*
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: bravel-desktop-*.zip
          generate_release_notes: true
